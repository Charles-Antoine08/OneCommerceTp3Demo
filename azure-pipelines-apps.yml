trigger:
- main

variables:
  buildConfiguration: 'Release'
  serviceConnection: 'az-serviceprincipal'

  # Web Apps Dev (remplacer xxxx par le suffixe réel)
  webApp_OneFichiers_Dev: 'webapp-OneFichiers-xxxx' # à remplacer par le vrai suffixe
  webApp_OneCommandes_Dev: 'webapp-OneCommandes-xxxx' 
  webApp_OneFidelite_Dev: 'webapp-OneFidelite-xxxx' 
  webApp_OneProduit_Dev: 'webapp-OneProduit-xxxx'  
  webApp_OneCommerceMVC_Dev: 'webapp-OneCommerceMVC-xxxx' 

  # Web Apps Prod (remplacer yyyy par le suffixe réel)
  webApp_OneFichiers_Prod: 'webapp-OneFichiers-yyyy' # à remplacer par le vrai suffixe
  webApp_OneCommandes_Prod: 'webapp-OneCommandes-yyyy'
  webApp_OneFidelite_Prod: 'webapp-OneFidelite-yyyy'
  webApp_OneProduit_Prod: 'webapp-OneProduit-yyyy'  
  webApp_OneCommerceMVC_Prod: 'webapp-OneCommerceMVC-yyyy'

stages:
- stage: Build
  displayName: 'Build et exécution des tests'
  jobs:
  - job: BuildJob
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Restaurer les packages'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Génération de la solution'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Exécution des tests unitaires'
      inputs:
        command: 'test'
        projects: '**/*Tests.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Publication des projets'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publication de l’artefact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# APIs Dev en parallèle après CI
- stage: DeployApisDev
  displayName: 'Déploiement APIs Dev'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy_OneFichiers_Dev
    displayName: 'Déploiement API OneFichiers Dev'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'
          - task: AzureRmWebAppDeployment@4
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: '$(serviceConnection)'
              appType: 'webApp'
              WebAppName: '$(webApp_OneFichiers_Dev)'
              package: '$(System.ArtifactsDirectory)/**/*.zip'

  - deployment: Deploy_OneCommandes_Dev
    displayName: 'Déploiement API OneCommandes Dev'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
