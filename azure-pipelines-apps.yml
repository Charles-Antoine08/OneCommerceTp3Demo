              azureSubscription: '$(serviceConnection)'
              appType: 'webApp'
              WebAppName: '$(webApp_OneCommandes_Dev)'
              package: '$(System.ArtifactsDirectory)/**/*.zip'

  - deployment: Deploy_OneFidelite_Dev
    displayName: 'Déploiement API OneFidelite Dev'
    environment: 'dev'
